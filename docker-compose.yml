services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "mongodb://localhost:27017/admin?directConnection=true", "--eval", "if (db.hello().isWritablePrimary !== true) quit(1)"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 3s
  mongo-init:
    image: mongo:8.0
    depends_on:
      mongo:
        condition: service_started
    entrypoint: ["/bin/bash", "-lc"]
    command: >-
      until mongosh --quiet "mongodb://mongo:27017/admin?directConnection=true" --eval "db.adminCommand({ping:1}).ok" >/dev/null 2>&1; do sleep 1; done;
      mongosh --quiet "mongodb://mongo:27017/admin?directConnection=true" --eval "try { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"localhost:27017\"}]}) } catch (e) { if (e.codeName !== \"AlreadyInitialized\") throw e }"
    restart: "no"

volumes:
  mongo_data:
